services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres_rag
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag
    ports:
      # 55432 no host: a 5432 local já está ocupada. 5432 é a porta interna do container.
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bootstrap_vector_ext:
    image: pgvector/pgvector:pg17
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # O command precisa ser UM único elemento de lista: `sh -c` só executa o primeiro
    # argumento como script. Escrito como string solta, o compose quebra em 7 argumentos
    # e o shell roda apenas `PGPASSWORD=postgres`, saindo com 0 sem criar a extensão.
    command:
      - |
        PGPASSWORD=postgres psql "postgresql://postgres:postgres@postgres:5432/rag" \
          -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector;"
    restart: "no"

volumes:
  postgres_data: